services:
  - type: web
    name: auravoice-rag
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python run_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
      - key: PYTHONPATH
        value: backend
